name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to their first Node 24 majors (Node 20 is deprecated on
# GitHub runners), and the runner image to ubuntu-24.04: ubuntu-latest moves to
# Ubuntu 26 from 2026-10-19, so the image changes only when this pin is bumped
# deliberately (after checking the suite and the jax/CUDA wheels on 26.04).
jobs:
  check:
    name: check (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      # Override .python-version (3.13) so the matrix drives the interpreter.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync (runtime + dev group)
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check src tests examples

      - name: Ruff format check
        run: uv run ruff format --check src tests examples

      - name: pydoclint (Google docstring contract)
        run: >-
          uv run pydoclint --style=google --arg-type-hints-in-docstring=False
          --check-return-types=False --check-class-attributes=True
          --skip-checking-private-functions=True src/plastax

      - name: ty (fast type check)
        run: uv run ty check src

      - name: mypy --strict (authoritative gate)
        run: uv run mypy --strict src

      - name: Pytest
        run: uv run pytest

      - name: Registry goldens match their generator
        run: uv run python scripts/parity/emit.py --check

  docs:
    name: docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tag history

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build docs (warnings are errors)
        run: uv run --group docs sphinx-build -W --keep-going -b html docs docs/_build
