name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      # Override .python-version (3.13) so the matrix drives the interpreter.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync (runtime + dev group)
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check src tests examples

      - name: Ruff format check
        run: uv run ruff format --check src tests examples

      - name: ty (fast type check)
        run: uv run ty check src

      - name: mypy --strict (authoritative gate)
        run: uv run mypy --strict src

      - name: Pytest
        run: uv run pytest
