# Tag-driven publishing via PyPI trusted publishing (OIDC); see docs/development/releasing.md.
# The PyPI trusted publisher is registered against THIS filename (publish.yml)
# and the `pypi` environment -- renaming either breaks authentication.
name: Publish

on:
  push:
    tags: ["v*"]

# Actions and runner image pinned as in ci.yml (Node 24 majors, ubuntu-24.04).
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tag history
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  verify:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v7 # only for examples/; install is wheel-only
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # Install from the wheel alone, smoke-test outside the repo dir
      # so accidental reliance on repo files is caught.
      - run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          ./venv/bin/python -c "import plastax"
          ./venv/bin/python "$GITHUB_WORKSPACE/examples/mlp_xor.py"

  publish-pypi:
    if: ${{ !contains(github.ref_name, 'rc') }}
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/plastax/
    permissions:
      id-token: write # OIDC token for trusted publishing; no stored secrets
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  # rc tags (v0.1.0rc1) go to TestPyPI. Requires a TestPyPI trusted publisher
  # registered for publish.yml + environment `testpypi` (see
  # docs/development/releasing.md).
  publish-testpypi:
    if: ${{ contains(github.ref_name, 'rc') }}
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/plastax/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
