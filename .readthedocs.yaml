# Read the Docs config; project: https://app.readthedocs.org/projects/plastax/
# No RTD-side env vars needed. Builds trigger via the RTD GitHub App webhook.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    install:
      # PEP 735 group install (pip >= 25.1 supports --group). hatch-vcs
      # derives the version from tags; if RTD's shallow clone lacks them,
      # add `git fetch --unshallow --tags || true` as a pre_install job.
      - pip install --upgrade pip
      - pip install --group docs .

sphinx:
  configuration: docs/conf.py
  # Flip to true once the full page structure replaces the scaffold.
  fail_on_warning: false
