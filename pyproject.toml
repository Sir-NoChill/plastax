[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 SPDX license metadata support
build-backend = "hatchling.build"

[project]
name = "plastax"
version = "0.1.0.dev0"
description = "Declarative plastic-network traits for JAX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ayrton Chilibeck", email = "aa@chilibeck.com" }]
keywords = [
  "jax",
  "plasticity",
  "neural-networks",
  "continual-learning",
  "sparse-networks",
  "dynamic-networks",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
# jax>=0.11 requires >=3.12 (uv universal resolver fails on 3.11); Deviation
# 2026-08-17. TOOLING.md pins the concrete interpreter via .python-version.
requires-python = ">=3.12"
dependencies = [
  "jax>=0.11.0",
  "jaxtyping>=0.2.36",
]

# Repository URLs land once the remote is provisioned (pending, per handoff).
# [project.urls]
# Homepage = "https://github.com/<owner>/plastax"
# Repository = "https://github.com/<owner>/plastax"
# Issues = "https://github.com/<owner>/plastax/issues"

# PEP 735 dependency group (not an extra): `uv sync` / `uv run` install this
# by default, so the bare `uv run ty|mypy|pytest` hook entries resolve it.
[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-xdist",
  "numpy",
  "beartype",
  "mypy>=1.14",
  "ty",
  "ruff",
  "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = ["src/plastax"]

# ty is the fast pre-commit checker; mypy --strict is the authoritative
# CI/pre-push gate (TOOLING.md).
[tool.mypy]
strict = true
files = ["src"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr"]

[[tool.mypy.overrides]]
module = ["jaxtyping.*", "jax.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# jaxtyping+beartype: annotated signatures become runtime contracts in tests
addopts = "--jaxtyping-packages=plastax,beartype.beartype"
markers = ["slow: excluded from the pre-push fast suite"]
filterwarnings = [
  # donation failure must be an error, rung0 design section 6
  "error:.*Some donated buffers were not usable.*",
]
