[build-system]
# PEP 639 SPDX license metadata (hatchling>=1.27); hatch-vcs derives the
# version from git tags so releases are tag-driven, never hand-edited.
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "plastax"
# Version comes from the latest `vX.Y.Z` git tag via [tool.hatch.version];
# do not set it here. Untagged/local builds use fallback_version (see below).
dynamic = ["version"]
description = "Declarative plastic-network traits for JAX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ayrton Chilibeck", email = "aa@chilibeck.com" }]
keywords = [
  "jax",
  "plasticity",
  "neural-networks",
  "continual-learning",
  "sparse-networks",
  "dynamic-networks",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
# requires-python >=3.12: uv's universal resolver has no solution at 3.11
# (Deviation 2026-08-17). .python-version pins the concrete interpreter (3.13).
requires-python = ">=3.12"
dependencies = [
  # Floor is 0.10.2: the API plastax uses (register_dataclass, jax.shard_map --
  # stable since 0.8.0 -- sharding.Mesh/PartitionSpec, make_array_from_process_
  # local_data) is present and validated on 0.10.2 (Alliance/Narval wheelhouse,
  # full fast suite green) through 0.11.x (local CUDA). See Deviations.
  "jax>=0.10.2",
  "jaxtyping>=0.2.36",
  # numpy is imported directly across src/plastax (state, builder, step,
  # topo, views, ...); declare it rather than lean on jax's transitive
  # install (P0.4). Floor matches jax's numpy>=2 requirement.
  "numpy>=2",
]

# Optional GPU backend. `pip install plastax[cuda12]` (or `uv sync --extra
# cuda12`) pulls the CUDA-12 jaxlib + plugin in place of the default CPU wheel;
# `gpu` is a friendly alias for it. plastax is backend-agnostic pure Python --
# the extra only swaps which jax wheel resolves, nothing in src/plastax changes.
# Validated with jax[cuda12]==0.11.0 on an RTX 3060 Ti (CUDA 12). Set
# XLA_PYTHON_CLIENT_PREALLOCATE=false on a shared GPU (see TOOLING.md).
[project.optional-dependencies]
cuda12 = ["jax[cuda12]>=0.10.2"]
gpu = ["plastax[cuda12]"]

[project.urls]
Homepage = "https://github.com/Sir-NoChill/plastax"
Repository = "https://github.com/Sir-NoChill/plastax"
Issues = "https://github.com/Sir-NoChill/plastax/issues"
Documentation = "https://plastax.readthedocs.io"

# PEP 735 dependency group (not an extra): `uv sync` / `uv run` install this
# by default, so the bare `uv run ty|mypy|pytest` hook entries resolve it.
[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-xdist",
  # numpy is a runtime dependency (see [project].dependencies), not dev-only.
  "beartype",
  "mypy>=1.14",
  "ty",
  "ruff",
  "pydoclint",
  "pre-commit",
  # jax.test_util (jax._src.test_util) imports absl.testing.parameterized;
  # jax itself only declares this as an optional test extra, not a runtime
  # dependency, so it must be added explicitly to use
  # assert_num_jit_and_pmap_compilations (M4b Deviation, IMPLEMENTATION_PLAN.md
  # -- the retrace-count tests the task requires import jax.test_util).
  "absl-py",
  # optax: reference oracle for the plastax.optim parity tests (Track A.1). A
  # test-only dependency, never a runtime dep (ECOSYSTEM_ROADMAP.md).
  "optax",
  # torchvision: CIFAR-10 download + loader for the dynamic-sparse-training
  # example (examples/cifar_dst.py). Dev/example-only -- never a runtime dep;
  # only its datasets.CIFAR10 reader is used, no torch compute.
  "torchvision",
]
# Docs group installed by RTD (.readthedocs.yaml) and the CI docs job;
# locally: `uv sync --group docs`, then
# `uv run sphinx-build -b html docs docs/_build`.
docs = [
  "sphinx>=8",
  "furo",
  "myst-parser",
  "sphinx-autodoc-typehints",
  "sphinx-copybutton",
]

# Tag-driven version: hatch-vcs reads the latest `vX.Y.Z` git tag (PEP 440).
# The repo starts tagless (P0.3), so untagged/dirty local builds fall back to
# fallback_version; a real `v*` tag push in CI derives the release version.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.1.0.dev0"

[tool.hatch.build.targets.wheel]
packages = ["src/plastax"]

# ty is the fast pre-commit checker; mypy --strict is the authoritative
# CI/pre-push gate (TOOLING.md). jax and jaxtyping ship py.typed, so mypy
# resolves jax.Array to the real class and erases jaxtyping's dtype[array,shape]
# to `array` (docs.kidger.site/jaxtyping/faq) -- no follow_imports skip needed.
[tool.mypy]
strict = true
files = ["src"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# D (pydocstyle): the library ships Google-style docstrings; see TOOLING.md.
select = ["E", "F", "I", "UP", "B", "ANN", "D"]
# F722/F821: jaxtyping shape strings (e.g. `Float[Array, " n"]`) read as broken
# forward references to the linter; jaxtyping recommends disabling them globally
# (docs.kidger.site/jaxtyping/faq). Type-checkers still erase the shape to
# `Array` via py.typed, so no real type information is lost.
# D107: `__init__` docstrings are intentionally omitted -- constructors are
# documented on the class (Google style), and pydoclint's DOC301 guards the
# other direction (no `__init__` docstring when the class already has one).
ignore = ["ANN401", "F722", "F821", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Docstring (D) rules apply to the library surface only; tests and examples
# are exempt from the docstring gate.
"tests/**" = ["D"]
"examples/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# jaxtyping+beartype: annotated signatures become runtime contracts in tests
addopts = "--jaxtyping-packages=plastax,beartype.beartype"
markers = ["slow: excluded from the pre-push fast suite"]
filterwarnings = [
  # donation failure must be an error, rung0 design section 6
  "error:.*Some donated buffers were not usable.*",
]
